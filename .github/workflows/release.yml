name: Build and publish macOS release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['VERSION', 'BUILD_NUMBER', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release version
        shell: bash
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$(cat VERSION)"; fi
      - name: Check behavior and types
        run: ./Tools/check.sh
      - name: Build universal app and ZIP
        run: ./Tools/package-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(cat VERSION)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its assets unchanged."
            exit 0
          fi
          gh release create "$tag" dist/Codex-bar-*.zip dist/Codex-bar-*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Codex bar $tag" \
            --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md
